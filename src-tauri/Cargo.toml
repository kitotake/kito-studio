[package]
name = "kito-studio"
version = "0.1.0"
description = "Kito Studio video editor"
authors = ["Kito Studio"]
edition = "2021"

[lib]
name = "kito_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
